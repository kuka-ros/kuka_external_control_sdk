name: CI RHEL/alma

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rhel_version: [8, 9]
      fail-fast: false
    container:
      image: almalinux:${{ matrix.rhel_version }}

    steps:
    - uses: actions/checkout@v2


    - name: Install protobuf for RHEL 8
      if: matrix.rhel_version == 8
      run: dnf install --enablerepo=powertools -y protobuf-devel
    - name: Install protobuf for RHEL 9
      if: matrix.rhel_version == 9
      run: dnf install --enablerepo=crb -y protobuf-devel
    - name: Install dependencies
      run: |
        #!/bin/bash
        dnf install -y https://repo.almalinux.org/almalinux/almalinux-release-synergy-latest-${{ matrix.rhel_version }}.noarch.rpm && dnf install -y cmake gcc-c++ openssl-devel gtest-devel tinyxml2-devel

    - name: Build and install common SDK
      run: mkdir -p build && cd build && cmake -DBUILD_TESTING=0 .. && make install
      working-directory: ./kuka_external_control_sdk_common

    - name: Build and install iiQKA2 SDK
      run: mkdir -p build && cd build && cmake -DBUILD_TESTING=1 .. && make install
      working-directory: ./kuka_external_control_sdk_iiqka2

    - name: Run iiQKA2 tests
      run: ./test_iiqka2_message_builder
      working-directory: ./kuka_external_control_sdk_iiqka2/build
